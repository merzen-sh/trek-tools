[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.dependencies]
trek-fxmanifest = { path = "crates/trek-fxmanifest" }
trek-codegen = { path = "crates/trek-codegen" }

anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
askama = { version = "0.16.0", default-features = false, features = ["derive", "alloc", "config"] }
clap = { version = "4.6.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context","string","color"] }
console = "0.15"
sha2 = "0.10"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
