[package]
name = "trek"
version.workspace = true
edition.workspace = true

[[bin]]
name = "trek"
path = "src/main.rs"

[features]
default = ["generate"]
generate = ["dep:askama"]

[dependencies]
trek-fxmanifest.workspace = true
trek-codegen.workspace = true

anyhow.workspace = true
askama = { workspace = true,optional = true }
clap.workspace = true
console.workspace = true
sha2.workspace = true
serde_yml.workspace = true
zip.workspace = true

[dev-dependencies]
tempfile = "3"
